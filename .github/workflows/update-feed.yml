name: Update Gundam News Feed

on:
  schedule:
    # 1時間に1回更新 (毎時17分)。GitHub の都合で数分〜数十分遅れることがある
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate feed
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          FEED_URL="https://${OWNER}.github.io/${REPO}/gundam_news.xml"
          python3 generate_rss.py --pages 3 --output gundam_news.xml --feed-url "${FEED_URL}"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gundam_news.xml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update feed"
            git push
          fi
